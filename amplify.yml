version: 1
backend:
  phases:
    build:
      commands:
        - echo "Using amplify.yml on repository root"
        # Deploy prisma layer as a lambda layer
        - cd prisma
        - npm ci
        - npx prisma generate
        - cd ..
        - mkdir -p nodejs/node_modules/portfolio-prisma/
        - cp -r prisma/ nodejs/node_modules/portfolio-prisma/
        - zip -r portfolio-prisma.zip nodejs
        - LAYER_OUTPUT=$(aws lambda publish-layer-version --layer-name portfolio-prisma --zip-file fileb://portfolio-prisma.zip)
        - 'LAYER_VERSION=$(echo $LAYER_OUTPUT | grep -o "\"Version\": *[0-9]*" | grep -o "[0-9]*")'
        - 'LAYER_ARN=$(echo $LAYER_OUTPUT | grep -o "\"LayerVersionArn\": *\"[^\"]*" | cut -d"\"" -f4)'
        - echo "Published Lambda Layer version $LAYER_VERSION with ARN $LAYER_ARN"
        - export PRISMA_LAMBDA_LAYER_ARN=$LAYER_ARN
        # Deploy backend
        - npm ci
        - npm rebuild @parcel/watcher --build-from-source
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID --debug
frontend:
  phases:
    preBuild:
      commands:
        # Generate prisma client
        - cd prisma
        - npm ci
        - npx prisma generate
        - cd ..
        # Install frontend dependencies
        - npm ci
    test:
      commands:
        - npm run test:ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
