version: 1
backend:
  phases:
    build:
      commands:
        - echo "Using amplify.yml on repository root"
        # Install jq for JSON parsing
        - yum install -y jq
        # Deploy prisma layer as a lambda layer
        - cd prisma
        - npm ci --cache .npm --prefer-offline
        - npx prisma generate
        - cd ..
        - mkdir -p nodejs/node_modules/portfolio-prisma/node_modules/.prisma/client
        - cp prisma/package.json nodejs/node_modules/portfolio-prisma/
        - cp prisma/package-lock.json nodejs/node_modules/portfolio-prisma/
        - cp -r prisma/prisma nodejs/node_modules/portfolio-prisma/
        # Copy only the generated Prisma client (not the entire @prisma packages)
        - cp -r prisma/node_modules/.prisma/client/* nodejs/node_modules/portfolio-prisma/node_modules/.prisma/client/
        # Remove unnecessary WASM files and binaries for other platforms (keep only rhel-openssl-3.0.x for Lambda)
        - rm nodejs/node_modules/portfolio-prisma/node_modules/.prisma/client/query_engine_bg.wasm
        - zip -r portfolio-prisma.zip nodejs
        - LAYER_OUTPUT=$(aws lambda publish-layer-version --layer-name portfolio-prisma --zip-file fileb://portfolio-prisma.zip)
        - LAYER_VERSION=$(echo $LAYER_OUTPUT | jq -r '.Version')
        - LAYER_ARN=$(echo $LAYER_OUTPUT | jq -r '.LayerVersionArn')
        - echo "Published Lambda Layer version $LAYER_VERSION with ARN $LAYER_ARN"
        - export PRISMA_LAMBDA_LAYER_ARN=$LAYER_ARN
        # Deploy backend
        - npm ci --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID --debug
frontend:
  phases:
    preBuild:
      commands:
        # Generate prisma client
        - cd prisma
        - npm ci --cache .npm --prefer-offline
        - npx prisma generate
        - cd ..
        # Install frontend dependencies
        - npm install
    test:
      commands:
        - npm run test:ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
      - node_modules/**/*
